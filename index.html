<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jumerumi</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }

    .producto {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      max-width: 300px;
    }

    .carrito {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #f8c8dc;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    #lista-carrito li {
      list-style: none;
      margin: 5px 0;
    }

    .contador {
      font-weight: bold;
      margin-left: 5px;
      color: red;
    }
  </style>
</head>
<body>

  <h1>Jumerumi - Productos</h1>

  <!-- PRODUCTOS -->
  <div class="producto">
    <img src="ranita.jpg" alt="Ranita" width="150" />
    <h3>Ranita</h3>
    <p>€10.00</p>
    <button class="agregar-carrito" data-nombre="Ranita" data-precio="10">Añadir al carrito</button>
  </div>

  <div class="producto">
    <img src="rosalila.jpg" alt="Rosa Lila" width="150" />
    <h3>Rosa Lila</h3>
    <p>€5.00</p>
    <button class="agregar-carrito" data-nombre="Rosa lila" data-precio="5">Añadir al carrito</button>
  </div>

  <!-- CARRITO -->
  <div class="carrito">
    🛒 Carrito: <span class="contador" id="contador-carrito">0</span>
    <ul id="lista-carrito"></ul>
    <p id="total-carrito">Total: €0.00</p>
  </div>

  <!-- SCRIPT -->
  <script>
    let contador = 0;
    let total = 0;
    const carrito = [];

    const botones = document.querySelectorAll('.agregar-carrito');
    const contadorCarrito = document.getElementById('contador-carrito');
    const listaCarrito = document.getElementById('lista-carrito');
    const totalCarrito = document.getElementById('total-carrito');

    botones.forEach(boton => {
      boton.addEventListener('click', () => {
        const nombre = boton.getAttribute('data-nombre');
        const precio = parseFloat(boton.getAttribute('data-precio'));

        carrito.push({ nombre, precio });
        contador++;
        total += precio;

        // Actualiza visualmente
        contadorCarrito.textContent = contador;

        const item = document.createElement('li');
        item.textContent = `${nombre} - €${precio.toFixed(2)}`;
        listaCarrito.appendChild(item);

        totalCarrito.textContent = `Total: €${total.toFixed(2)}`;
      });
    });
  </script>
</body>
</html>
