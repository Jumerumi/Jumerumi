<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jumerumi - Hecho a mano</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Comic Sans MS', sans-serif;
      background-color: #ffffff;
      color: #333;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background-color: #f2eadf;
      z-index: 1000;
    }

    .menu-izquierda {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-izquierda select {
      padding: 6px 10px;
      font-size: 14px;
      border-radius: 4px;
    }

    .logo-centro img {
      height: 100px;
    }

    .iconos-derecha {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .iconos-derecha img {
      width: 24px;
      cursor: pointer;
    }

    .frase {
      text-align: center;
      font-style: italic;
      margin: 30px 10px;
      color: #bb5a5a;
      font-size: 18px;
    }

    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .producto {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      background-color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .producto img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .producto h3 {
      margin: 10px 0 5px;
      font-size: 16px;
    }

    .producto p {
      margin: 0 0 10px;
      font-weight: bold;
    }

    .producto button {
      padding: 6px 12px;
      background-color: #ffaaaa;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .producto button:hover {
      background-color: #e58b8b;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #fff0f0;
      font-size: 14px;
      margin-top: 40px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="menu-izquierda">
      <select>
        <option>Productos</option>
        <option>Amigurumis</option>
        <option>Marcapáginas</option>
        <option>Llaveros</option>
        <option>Accesorios</option>
      </select>
    </div>

    <div class="logo-centro">
      <img src="nuevo logo.png" alt="Logo Jumerumi" />
    </div>

    <!-- Ícono carrito funcional -->
    <div class="carrito" style="cursor: pointer;">
      🛒 <span id="contador-carrito">0</span>
    </div>

    <!-- Lista del carrito -->
    <div id="carrito-contenido" style="display: none; background: #fff; border: 1px solid #ccc; padding: 10px; position: absolute; right: 10px; top: 50px; width: 250px;">
      <h4>Carrito:</h4>
      <ul id="lista-carrito"></ul>
    </div>
  </header>

  <!-- FRASE -->
  <div class="frase">"Cada puntada hecha a mano guarda un pedacito de amor."</div>

  <!-- PRODUCTOS -->
  <section class="productos">
<div class="producto" data-nombre="Ranita" data-precio="10">
  <img src="ranita.jpg" alt="Ranita" width="150" />
  <h3>Ranita</h3>
  <p>€10.00</p>
  <button class="menos">-</button>
  <span class="cantidad">0</span>
  <button class="mas">+</button>
</div>

    <div class="producto">
      <img src="rosalila.jpg" alt="Marcapágina" />
      <h3 class="nombre-producto">Rosa lila</h3>
      <p>€5.00</p>
      <button class="agregar-carrito">Añadir al carrito</button>
    </div>
    
    <div class="producto">
      <img src="abejita.jpg" alt="Marcapágina" />
      <h3 class="nombre-producto">Abeja</h3>
      <p>€8.00</p>
      <button class="agregar-carrito">Añadir al carrito</button>
    </div>

    <!-- Puedes duplicar más productos aquí -->
  </section>

  <!-- PIE DE PÁGINA -->
  <footer>
    📞 610038713 | 📍 Sevilla, España
  </footer>

  <!-- JAVASCRIPT DEL CARRITO -->
  <script>
  let contador = 0;
  const carrito = {};

  const botones = document.querySelectorAll('.agregar-carrito');
  const contadorCarrito = document.getElementById('contador-carrito');
  const listaCarrito = document.getElementById('lista-carrito');
  const carritoContenido = document.getElementById('carrito-contenido');
  const carritoIcono = document.querySelector('.carrito');

  botones.forEach(boton => {
    boton.addEventListener('click', () => {
      const producto = boton.closest('.producto');
      const nombre = producto.querySelector('h3').textContent;

      // Incrementar el contador total
      contador++;
      contadorCarrito.textContent = contador;

      // Contador individual por producto
      if (carrito[nombre]) {
        carrito[nombre]++;
      } else {
        carrito[nombre] = 1;
      }

      // Actualizar la lista del carrito
      actualizarListaCarrito();
    });
  });

  function actualizarListaCarrito() {
    listaCarrito.innerHTML = '';
    for (const nombre in carrito) {
      const cantidad = carrito[nombre];
      const item = document.createElement('li');
      item.textContent = `${nombre} x${cantidad}`;
      listaCarrito.appendChild(item);
    }
  }

  carritoIcono.addEventListener('click', () => {
    carritoContenido.style.display =
      carritoContenido.style.display === 'none' ? 'block' : 'none';
  });
</script>


</body>
</html>
